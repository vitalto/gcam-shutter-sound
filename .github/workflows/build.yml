name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build (offline toolchain)
        run: bash tools/build.sh
        env:
          ANDROID_SDK: ${{ env.ANDROID_SDK_ROOT }}

      - uses: actions/upload-artifact@v4
        with:
          name: GCamCustomShutter
          path: build/GCamCustomShutter.apk
