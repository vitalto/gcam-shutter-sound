plugins {
    id 'com.android.application'
}

android {
    namespace 'com.roottools.shuttersound'
    compileSdk 35

    defaultConfig {
        applicationId 'com.roottools.shuttersound'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
